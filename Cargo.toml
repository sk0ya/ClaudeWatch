[package]
name = "claude-watch"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
sysinfo = "0.33"

[build-dependencies]
winres = "0.1"
